<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoMar Digital — Digital Growth for Modern Businesses</title>
  <style>
    :root {
      --bg: #070b14;
      --surface: #0f1629;
      --accent: #3b82f6;
      --accent-2: #8b5cf6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    a { color: var(--accent); text-decoration: none; }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(7,11,20,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    nav {
      max-width: 1100px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px;
    }
    .logo { font-weight: 800; font-size: 1.3rem; }
    .logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a { color: var(--muted); }
    .cta {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white; padding: 10px 20px; border-radius: 10px; font-weight: 600;
    }
    section { max-width: 1100px; margin: 0 auto; padding: 60px 24px; }
    h2 { font-size: 2rem; margin-bottom: 12px; }
    .sub { color: var(--muted); margin-bottom: 36px; }
